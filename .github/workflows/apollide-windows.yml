---
# Apollide: build the Windows MSI for every apollide/<version> branch that tools/apollide.py publishes.
# Reuses Vibepollo's own Windows build (ci-windows.yml) unchanged; no signing secrets in this fork.
name: Apollide Windows
permissions: {}

on:
  push:
    branches:
      - 'apollide/**'
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ci-windows.yml
    with:
      use_self_hosted: false
      build_only: true
      build_tests: false
      release_commit: ${{ github.sha }}
      release_version: 2.0.2
      release_artifact_retention_days: 14
      symbol_product_name: Vibepollo
      symbol_release_prefix: apollide
      publish_symbols: false
      require_truehdr_runtime: true
